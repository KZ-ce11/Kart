<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Kart Racer</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border: 4px solid #333;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            display: block;
            background-color: #5c94fc;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-top {
            display: flex;
            justify-content: space-between;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000;
        }
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: auto;
        }
        h1 {
            font-size: 48px;
            color: #ffcc00;
            text-shadow: 4px 4px 0 #d9381e;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            max-width: 500px;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        button {
            padding: 15px 35px;
            font-size: 24px;
            font-family: inherit;
            font-weight: bold;
            color: white;
            background-color: #d9381e;
            border: 4px solid #ffcc00;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        button:hover {
            transform: scale(1.05);
            background-color: #ff4526;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    
    <div id="ui-overlay">
        <div class="hud-top">
            <div id="lap-display">LAP: 1 / 3</div>
            <div id="time-display">TIME: 0.0s</div>
            <div id="speed-display">0 MPH</div>
        </div>
    </div>

    <div id="start-screen">
        <h1>TURBO KART</h1>
        <p>Use <b>ARROW KEYS</b> or <b>W A S D</b> to drive.<br>Hit yellow boost pads for extra speed and dodge rival karts!</p>
        <button id="start-btn">START RACE</button>
    </div>

    <div id="game-over-screen" class="hidden">
        <h1>FINISH!</h1>
        <p id="final-stats">Final Time: 0.0s</p>
        <button id="restart-btn">RACE AGAIN</button>
    </div>
</div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    // UI Elements
    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const lapDisplay = document.getElementById('lap-display');
    const timeDisplay = document.getElementById('time-display');
    const speedDisplay = document.getElementById('speed-display');
    const finalStats = document.getElementById('final-stats');

    // Game Constants
    const FPS = 60;
    const STEP = 1 / FPS;
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;
    const ROAD_WIDTH = 2000;
    const SEGMENT_LENGTH = 200;
    const RUMBLE_LENGTH = 3;
    const LANES = 3;
    const FIELD_OF_VIEW = 100;
    const CAMERA_HEIGHT = 1000;
    const CAMERA_DEPTH = 1 / Math.tan((FIELD_OF_VIEW / 2) * Math.PI / 180);
    const DRAW_DISTANCE = 300;
    const TOTAL_LAPS = 3;

    // Player & Physics
    let playerX = 0; // -1 to 1
    let playerZ = 0;
    let position = 0;
    let speed = 0;
    const maxSpeed = SEGMENT_LENGTH / STEP;
    const accel = maxSpeed / 5;
    const breaking = -maxSpeed;
    const decel = -maxSpeed / 5;
    const offRoadDecel = -maxSpeed / 2;
    const offRoadLimit = maxSpeed / 4;
    let boostTimer = 0;

    // Game State
    let segments = [];
    let cars = [];
    let trackLength = 0;
    let gameRunning = false;
    let currentLap = 1;
    let raceTime = 0;
    let lastTime = 0;

    // Input Handling
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, w: false, s: false, a: false, d: false };
    window.addEventListener('keydown', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = true; });
    window.addEventListener('keyup', (e) => { if (keys.hasOwnProperty(e.key)) keys[e.key] = false; });

    // Colors
    const COLORS = {
        SKY: '#5c94fc',
        TREE: '#005108',
        FOG: '#5c94fc',
        LIGHT: { road: '#6b6b6b', grass: '#10aa10', rumble: '#555555', lane: '#cccccc' },
        DARK:  { road: '#696969', grass: '#009a00', rumble: '#bbbbbb' },
        START: { road: 'white',   grass: 'white',   rumble: 'white' },
        FINISH:{ road: 'black',   grass: 'black',   rumble: 'black' }
    };

    // Build Track Geometry
    function addSegment(curve, y) {
        const n = segments.length;
        segments.push({
            index: n,
            p1: { world: { y: lastY(), z: n * SEGMENT_LENGTH }, camera: {}, screen: {} },
            p2: { world: { y: y,       z: (n + 1) * SEGMENT_LENGTH }, camera: {}, screen: {} },
            curve: curve,
            sprites: [],
            cars: [],
            boostPad: null,
            color: Math.floor(n / RUMBLE_LENGTH) % 2 ? COLORS.DARK : COLORS.LIGHT
        });
    }

    function lastY() {
        return (segments.length === 0) ? 0 : segments[segments.length - 1].p2.world.y;
    }

    function addRoad(enter, hold, leave, curve, y) {
        const startY = lastY();
        const endY = startY + (y * SEGMENT_LENGTH);
        const total = enter + hold + leave;
        for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
        for (let n = 0; n < hold; n++)  addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
        for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
    }

    function easeIn(a, b, percent) { return a + (b - a) * Math.pow(percent, 2); }
    function easeInOut(a, b, percent) { return a + (b - a) * ((-Math.cos(percent * Math.PI) / 2) + 0.5); }

    function resetRoad() {
        segments = [];
        addRoad(50, 50, 50, 0, 0);          // Start straight
        addRoad(50, 100, 50, 3, 20);        // Right hill curve
        addRoad(50, 50, 50, 0, -20);        // Downhill straight
        addRoad(50, 120, 50, -4, 0);        // Sharp left
        addRoad(50, 80, 50, 2, 40);         // Big climb right
        addRoad(50, 80, 50, -3, -40);       // Big drop left
        addRoad(50, 100, 50, 0, 0);         // Final straight

        // Start/Finish line coloring
        segments[2].color = COLORS.START;
        segments[3].color = COLORS.START;
        for (let n = 0; n < RUMBLE_LENGTH; n++) {
            segments[segments.length - 1 - n].color = COLORS.FINISH;
        }

        // Add Scenery (Trees/Billboards) & Boost Pads
        for (let n = 20; n < segments.length - 20; n += 8) {
            segments[n].sprites.push({ source: 'tree', offset: -1.4 - Math.random() * 1.5 });
            segments[n].sprites.push({ source: 'tree', offset: 1.4 + Math.random() * 1.5 });
            
            if (n % 80 === 0) {
                segments[n].boostPad = (Math.random() > 0.5) ? -0.5 : 0.5;
            }
        }

        trackLength = segments.length * SEGMENT_LENGTH;
        resetCars();
    }

    function resetCars() {
        cars = [];
        const totalCars = 12;
        for (let n = 0; n < totalCars; n++) {
            const offset = (Math.random() * 1.6) - 0.8;
            const z = Math.floor(Math.random() * segments.length) * SEGMENT_LENGTH;
            const speed = maxSpeed / 4 + Math.random() * (maxSpeed / 3);
            const car = { offset: offset, z: z, speed: speed, color: n % 2 === 0 ? '#e62e2e' : '#2e6be6' };
            const segment = findSegment(car.z);
            segment.cars.push(car);
            cars.push(car);
        }
    }

    function findSegment(z) {
        return segments[Math.floor(z / SEGMENT_LENGTH) % segments.length];
    }

    // 3D Projection Math
    function project(p, cameraX, cameraY, cameraZ, cameraDepth, width, height, roadWidth) {
        p.camera.x = (p.world.x || 0) - cameraX;
        p.camera.y = (p.world.y || 0) - cameraY;
        p.camera.z = (p.world.z || 0) - cameraZ;
        p.screen.scale = cameraDepth / p.camera.z;
        p.screen.x = Math.round((width / 2) + (p.screen.scale * p.camera.x * width / 2));
        p.screen.y = Math.round((height / 2) - (p.screen.scale * p.camera.y * height / 2));
        p.screen.w = Math.round((p.screen.scale * roadWidth * width / 2));
    }

    function overlap(x1, w1, x2, w2, percent) {
        const half = (percent || 1) / 2;
        const min1 = x1 - (w1 * half);
        const max1 = x1 + (w1 * half);
        const min2 = x2 - (w2 * half);
        const max2 = x2 + (w2 * half);
        return !((max1 < min2) || (min1 > max2));
    }

    // Update Game Loop
    function update(dt) {
        if (!gameRunning) return;

        raceTime += dt;
        const playerSegment = findSegment(position + playerZ);
        const speedPercent = speed / maxSpeed;
        const dx = dt * 2 * speedPercent;

        // Lap Tracking
        const prevPosition = position;
        position = (position + dt * speed) % trackLength;
        if (position < prevPosition) {
            currentLap++;
            if (currentLap > TOTAL_LAPS) {
                endGame();
                return;
            }
        }

        // Steering & Centrifugal Force
        if (keys.ArrowLeft || keys.a) playerX -= dx;
        if (keys.ArrowRight || keys.d) playerX += dx;
        playerX -= (dx * speedPercent * playerSegment.curve * 0.5);

        // Acceleration & Braking
        if (keys.ArrowUp || keys.w) speed += accel * dt;
        else if (keys.ArrowDown || keys.s) speed += breaking * dt;
        else speed += decel * dt;

        // Off-road slowdown
        if ((playerX < -1) || (playerX > 1)) {
            if (speed > offRoadLimit) speed += offRoadDecel * dt;
        }

        // Boost Pad Check
        if (playerSegment.boostPad !== null) {
            if (Math.abs(playerX - playerSegment.boostPad) < 0.35) {
                boostTimer = 1.0; // 1 second boost
            }
        }

        let currentMaxSpeed = maxSpeed;
        if (boostTimer > 0) {
            boostTimer -= dt;
            currentMaxSpeed = maxSpeed * 1.35;
            speed = currentMaxSpeed;
        }

        // Clamp values
        playerX = Math.max(-2.5, Math.min(2.5, playerX));
        speed = Math.max(0, Math.min(currentMaxSpeed, speed));

        // Update Rival Karts & Check Collisions
        for (let i = 0; i < cars.length; i++) {
            const car = cars[i];
            const oldSegment = findSegment(car.z);
            car.z = (car.z + dt * car.speed) % trackLength;
            const newSegment = findSegment(car.z);

            if (oldSegment !== newSegment) {
                const index = oldSegment.cars.indexOf(car);
                oldSegment.cars.splice(index, 1);
                newSegment.cars.push(car);
            }

            // Player vs Rival Collision
            if (newSegment === playerSegment) {
                if (overlap(playerX, 0.35, car.offset, 0.35, 0.8)) {
                    speed = car.speed * 0.5;
                    position = (car.z - playerZ - SEGMENT_LENGTH + trackLength) % trackLength;
                }
            }
        }

        // Update HUD
        lapDisplay.textContent = `LAP: ${currentLap} / ${TOTAL_LAPS}`;
        timeDisplay.textContent = `TIME: ${raceTime.toFixed(1)}s`;
        speedDisplay.textContent = `${Math.round((speed / maxSpeed) * 150)} MPH`;
    }

    // Render Graphics
    function drawPolygon(x1, y1, x2, y2, x3, y3, x4, y4, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineTo(x3, y3);
        ctx.lineTo(x4, y4);
        ctx.closePath();
        ctx.fill();
    }

    function drawSegment(width, lanes, x1, y1, w1, x2, y2, w2, color, boostPad) {
        const r1 = w1 / Math.max(6, 2 * lanes);
        const r2 = w2 / Math.max(6, 2 * lanes);
        const l1 = w1 / Math.max(32, 8 * lanes);
        const l2 = w2 / Math.max(32, 8 * lanes);

        // Grass
        ctx.fillStyle = color.grass;
        ctx.fillRect(0, y2, width, y1 - y2);

        // Rumble strips
        drawPolygon(x1 - w1 - r1, y1, x1 - w1, y1, x2 - w2, y2, x2 - w2 - r2, y2, color.rumble);
        drawPolygon(x1 + w1 + r1, y1, x1 + w1, y1, x2 + w2, y2, x2 + w2 + r2, y2, color.rumble);

        // Road surface
        drawPolygon(x1 - w1, y1, x1 + w1, y1, x2 + w2, y2, x2 - w2, y2, color.road);

        // Lane dividers
        if (color.lane) {
            const lanew1 = w1 * 2 / lanes;
            const lanew2 = w2 * 2 / lanes;
            let lanex1 = x1 - w1 + lanew1;
            let lanex2 = x2 - w2 + lanew2;
            for (let lane = 1; lane < lanes; lanex1 += lanew1, lanex2 += lanew2, lane++) {
                drawPolygon(lanex1 - l1 / 2, y1, lanex1 + l1 / 2, y1, lanex2 + l2 / 2, y2, lanex2 - l2 / 2, y2, color.lane);
            }
        }

        // Boost Pad
        if (boostPad !== null) {
            const bx1 = x1 + (w1 * boostPad);
            const bx2 = x2 + (w2 * boostPad);
            const bw1 = w1 * 0.25;
            const bw2 = w2 * 0.25;
            drawPolygon(bx1 - bw1, y1, bx1 + bw1, y1, bx2 + bw2, y2, bx2 - bw2, y2, '#ffcc00');
        }
    }

    function drawTree(x, y, scale) {
        const trunkW = 40 * scale * WIDTH;
        const trunkH = 120 * scale * WIDTH;
        const crownR = 110 * scale * WIDTH;

        if (crownR < 2) return;

        ctx.fillStyle = '#5c3a21';
        ctx.fillRect(x - trunkW / 2, y - trunkH, trunkW, trunkH);

        ctx.fillStyle = '#0d6e0d';
        ctx.beginPath();
        ctx.arc(x, y - trunkH, crownR, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawKart(x, y, scale, color, steer, isPlayer) {
        const w = 160 * scale * WIDTH;
        const h = 90 * scale * WIDTH;
        if (w < 4) return;

        const bounce = isPlayer && speed > 0 ? Math.sin(Date.now() / 40) * 2 : 0;
        const drawY = y + bounce;

        // Shadow
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(x - w * 0.55, drawY - h * 0.1, w * 1.1, h * 0.2);

        // Tires
        ctx.fillStyle = '#1a1a1a';
        ctx.fillRect(x - w * 0.55, drawY - h * 0.45, w * 0.2, h * 0.45);
        ctx.fillRect(x + w * 0.35, drawY - h * 0.45, w * 0.2, h * 0.45);

        // Kart Chassis
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x - w * 0.4, drawY - h * 0.6, w * 0.8, h * 0.5, 8 * scale * WIDTH);
        ctx.fill();

        // Engine / Exhaust
        ctx.fillStyle = '#888';
        ctx.fillRect(x - w * 0.15, drawY - h * 0.75, w * 0.3, h * 0.25);

        // Boost Flame
        if (isPlayer && boostTimer > 0) {
            ctx.fillStyle = Math.random() > 0.5 ? '#ffaa00' : '#ff3300';
            ctx.beginPath();
            ctx.arc(x, drawY - h * 0.35, w * 0.22, 0, Math.PI * 2);
            ctx.fill();
        }

        // Driver Helmet
        const headOffset = steer * (w * 0.1);
        ctx.fillStyle = isPlayer ? '#ffcc00' : '#ffffff';
        ctx.beginPath();
        ctx.arc(x + headOffset, drawY - h * 0.9, w * 0.22, 0, Math.PI * 2);
        ctx.fill();

        // Visor
        ctx.fillStyle = '#222';
        ctx.fillRect(x + headOffset - w * 0.15, drawY - h * 0.95, w * 0.3, h * 0.12);
    }

    function render() {
        ctx.clearRect(0, 0, WIDTH, HEIGHT);

        // Sky & Mountains Background
        ctx.fillStyle = COLORS.SKY;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        const baseSegment = findSegment(position);
        const basePercent = (position % SEGMENT_LENGTH) / SEGMENT_LENGTH;
        const playerSegment = findSegment(position + playerZ);
        const playerPercent = ((position + playerZ) % SEGMENT_LENGTH) / SEGMENT_LENGTH;
        const playerY = playerSegment.p1.world.y + (playerSegment.p2.world.y - playerSegment.p1.world.y) * playerPercent;

        // Draw distant hills
        ctx.fillStyle = '#3b7d3b';
        for (let i = -1; i < 4; i++) {
            const hillX = (i * 350) - ((baseSegment.index * 2) % 350);
            ctx.beginPath();
            ctx.arc(hillX, HEIGHT / 2 + 20, 200, Math.PI, 0);
            ctx.fill();
        }

        let maxy = HEIGHT;
        let x = 0;
        let dx = -(baseSegment.curve * basePercent);

        // Project & Draw Road Segments Front-to-Back
        for (let n = 0; n < DRAW_DISTANCE; n++) {
            const segment = segments[(baseSegment.index + n) % segments.length];
            const looped = segment.index < baseSegment.index;
            const camZ = position - (looped ? trackLength : 0);

            project(segment.p1, (playerX * ROAD_WIDTH) - x, playerY + CAMERA_HEIGHT, camZ, CAMERA_DEPTH, WIDTH, HEIGHT, ROAD_WIDTH);
            project(segment.p2, (playerX * ROAD_WIDTH) - x - dx, playerY + CAMERA_HEIGHT, camZ, CAMERA_DEPTH, WIDTH, HEIGHT, ROAD_WIDTH);

            x += dx;
            dx += segment.curve;

            if ((segment.p1.camera.z <= CAMERA_DEPTH) || (segment.p2.screen.y >= segment.p1.screen.y) || (segment.p2.screen.y >= maxy)) {
                continue;
            }

            drawSegment(WIDTH, LANES,
                segment.p1.screen.x, segment.p1.screen.y, segment.p1.screen.w,
                segment.p2.screen.x, segment.p2.screen.y, segment.p2.screen.w,
                segment.color, segment.boostPad
            );

            maxy = segment.p1.screen.y;
        }

        // Draw Sprites & Rival Cars Back-to-Front
        for (let n = DRAW_DISTANCE - 1; n > 0; n--) {
            const segment = segments[(baseSegment.index + n) % segments.length];

            // Roadside Scenery
            for (let i = 0; i < segment.sprites.length; i++) {
                const sprite = segment.sprites[i];
                const spriteScale = segment.p1.screen.scale;
                const spriteX = segment.p1.screen.x + (spriteScale * sprite.offset * ROAD_WIDTH * WIDTH / 2);
                const spriteY = segment.p1.screen.y;
                drawTree(spriteX, spriteY, spriteScale);
            }

            // Rival Karts
            for (let i = 0; i < segment.cars.length; i++) {
                const car = segment.cars[i];
                const carPercent = (car.z % SEGMENT_LENGTH) / SEGMENT_LENGTH;
                const carScale = segment.p1.screen.scale + (segment.p2.screen.scale - segment.p1.screen.scale) * carPercent;
                const carX = segment.p1.screen.x + (carScale * car.offset * ROAD_WIDTH * WIDTH / 2);
                const carY = segment.p1.screen.y + (segment.p2.screen.y - segment.p1.screen.y) * carPercent;
                drawKart(carX, carY, carScale, car.color, 0, false);
            }
        }

        // Draw Player Kart
        let steer = 0;
        if (keys.ArrowLeft || keys.a) steer = -1;
        if (keys.ArrowRight || keys.d) steer = 1;
        drawKart(WIDTH / 2, HEIGHT - 40, 0.0014, '#ff9900', steer, true);
    }

    // Main Loop
    function frame(now) {
        const dt = Math.min(1, (now - lastTime) / 1000);
        lastTime = now;
        update(dt);
        render();
        requestAnimationFrame(frame);
    }

    function startGame() {
        playerX = 0;
        position = 0;
        speed = 0;
        currentLap = 1;
        raceTime = 0;
        boostTimer = 0;
        resetRoad();
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        gameRunning = true;
    }

    function endGame() {
        gameRunning = false;
        finalStats.textContent = `You finished 3 laps in ${raceTime.toFixed(2)} seconds!`;
        gameOverScreen.classList.remove('hidden');
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Initialize initial background preview
    playerZ = CAMERA_HEIGHT * CAMERA_DEPTH;
    resetRoad();
    lastTime = performance.now();
    requestAnimationFrame(frame);
</script>
</body>
</html>
